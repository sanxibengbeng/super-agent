name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, staging, prod]
        default: dev
      skip_infra:
        description: 'Skip CDK deploy'
        type: boolean
        default: false
      skip_migration:
        description: 'Skip DB migration'
        type: boolean
        default: false
      build_agentcore:
        description: 'Build AgentCore image'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Push (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      deploy_env: ${{ steps.meta.outputs.env }}
      stack_name: ${{ steps.meta.outputs.stack }}
      cluster_name: ${{ steps.meta.outputs.cluster }}
    steps:
      - uses: actions/checkout@v4

      - name: Set metadata
        id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "stack=SuperAgent-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "cluster=super-agent-$DEPLOY_ENV" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO="super-agent-backend-$DEPLOY_ENV"
          cd backend
          docker build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$REPO:latest" \
            -f Dockerfile .
          docker push "$ECR_REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$REPO:latest"

      - name: Build & push agentcore image
        if: ${{ github.event.inputs.build_agentcore == 'true' }}
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          REPO="super-agent-agentcore-$DEPLOY_ENV"
          cd agentcore
          DOCKER_BUILDKIT=0 docker build \
            --platform linux/arm64 \
            -t "$ECR_REGISTRY/$REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$REPO:latest" \
            -f Dockerfile .
          docker push "$ECR_REGISTRY/$REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$REPO:latest"

  deploy-infra:
    name: Deploy Infrastructure (${{ needs.build.outputs.deploy_env }})
    needs: build
    if: ${{ github.event.inputs.skip_infra != 'true' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
      STACK_NAME: ${{ needs.build.outputs.stack_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install CDK dependencies
        run: cd infra && npm ci

      - name: CDK Diff
        run: cd infra && npx cdk diff "$STACK_NAME" -c env="$DEPLOY_ENV" || true

      - name: CDK Deploy
        run: |
          cd infra
          npx cdk deploy "$STACK_NAME" \
            -c env="$DEPLOY_ENV" \
            --require-approval never \
            --ci

  deploy-app:
    name: Deploy Application (${{ needs.build.outputs.deploy_env }})
    needs: [build, deploy-infra]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
      ECS_CLUSTER: ${{ needs.build.outputs.cluster_name }}
      STACK_NAME: ${{ needs.build.outputs.stack_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          SERVICES=$(aws ecs list-services --cluster "$ECS_CLUSTER" \
            --query "serviceArns[*]" --output text)

          for SERVICE_ARN in $SERVICES; do
            SERVICE_NAME=$(echo "$SERVICE_ARN" | awk -F'/' '{print $NF}')
            echo "Deploying: $SERVICE_NAME"
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE_NAME" \
              --force-new-deployment \
              --no-cli-pager > /dev/null
          done

      - name: Wait for services to stabilize
        run: |
          SERVICES=$(aws ecs list-services --cluster "$ECS_CLUSTER" \
            --query "serviceArns[*]" --output text)
          echo "Waiting for ECS services to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services $SERVICES

      - name: Run database migration
        if: ${{ github.event.inputs.skip_migration != 'true' }}
        run: |
          # Find API service
          API_SERVICE=""
          for SVC in $(aws ecs list-services --cluster "$ECS_CLUSTER" \
            --query "serviceArns[*]" --output text); do
            NAME=$(echo "$SVC" | awk -F'/' '{print $NF}')
            if echo "$NAME" | grep -qi "api"; then
              API_SERVICE="$NAME"
              break
            fi
          done

          TASK_ARN=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
            --service-name "$API_SERVICE" \
            --desired-status RUNNING \
            --query "taskArns[0]" --output text)

          echo "Running migration on task: $TASK_ARN"
          aws ecs execute-command \
            --cluster "$ECS_CLUSTER" \
            --task "$TASK_ARN" \
            --container "ApiContainer" \
            --command "npx prisma migrate deploy" \
            --interactive

  smoke-test:
    name: Smoke Test (${{ needs.build.outputs.deploy_env }})
    needs: [build, deploy-app]
    runs-on: ubuntu-latest
    env:
      STACK_NAME: ${{ needs.build.outputs.stack_name }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get CloudFront domain
        id: cf
        run: |
          DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" \
            --output text)
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "CloudFront domain: $DOMAIN"

      - name: Health check
        run: |
          DOMAIN="${{ steps.cf.outputs.domain }}"
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$DOMAIN/health" || echo "000")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Health check PASSED"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in 15s..."
            sleep 15
          done
          echo "Health check FAILED"
          exit 1

      - name: Frontend check
        run: |
          DOMAIN="${{ steps.cf.outputs.domain }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$DOMAIN/" || echo "000")
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "Frontend check PASSED"
          else
            echo "Frontend check FAILED: HTTP $HTTP_CODE"
            exit 1
          fi
